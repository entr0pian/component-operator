---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - platform.taskapp.io
  resources:
  - components
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.taskapp.io
  resources:
  - components/finalizers
  verbs:
  - update
- apiGroups:
  - platform.taskapp.io
  resources:
  - components/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - repo.taskapp.io
  resources:
  - githubrepositories
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - repo.taskapp.io
  resources:
  - githubrepositories/status
  verbs:
  - get
- apiGroups:
  - scaffold.taskapp.io
  resources:
  - scaffoldrequests
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - scaffold.taskapp.io
  resources:
  - scaffoldrequests/status
  verbs:
  - get
