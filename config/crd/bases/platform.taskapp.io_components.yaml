---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: components.platform.taskapp.io
spec:
  group: platform.taskapp.io
  names:
    kind: Component
    listKind: ComponentList
    plural: components
    singular: component
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Component is the Schema for the components API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Component
            properties:
              owner:
                description: |-
                  owner is the team responsible for this component. Label-only today —
                  not forwarded to the GitHubRepository XR, which has no matching field.
                type: string
              repository:
                description: |-
                  repository describes the GitHub repository this component owns.
                  Component's own controller creates and owns the GitHubRepository XR
                  derived from this field — see PLATFORM_API_ARCHITECTURE.md's
                  OWNERSHIP EXCEPTION section. Deleting this Component cascade-deletes
                  that XR, and therefore the real GitHub repository.
                properties:
                  name:
                    description: name overrides the repository name; defaults to metadata.name
                      when omitted.
                    type: string
                  visibility:
                    default: private
                    enum:
                    - public
                    - private
                    - internal
                    type: string
                type: object
              scaffold:
                description: |-
                  scaffold requests a one-time initial commit into the owned repository
                  once it's ready, rendered from a platform-scaffolds template.
                  Component's own controller creates (but does not own — see
                  PLATFORM_API_ARCHITECTURE.md's CREATION EXCEPTION section) a
                  ScaffoldRequest from this field. Presence/absence of this pointer is
                  what gates scaffolding entirely — an existing Component with no
                  spec.scaffold behaves exactly as it does today. Once the resulting
                  ScaffoldRequest completes, this field is never re-acted on, even if
                  changed — no auto-migration of an already-scaffolded repo.
                properties:
                  template:
                    description: template is the platform-scaffolds template name
                      (e.g. golang-service).
                    type: string
                  version:
                    description: |-
                      version is the platform-scaffolds template's SemVer tag (e.g. 0.1.0),
                      without the template name prefix or a leading "v".
                    type: string
                required:
                - template
                - version
                type: object
            required:
            - owner
            - repository
            type: object
          status:
            description: status defines the observed state of Component
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Component resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types:
                  - "Ready": true once every owned related resource (currently just the
                    GitHubRepository) is ready.
                  - "RepositoryReady": true once the owned GitHubRepository XR reports Ready.
                  - "Scaffolded": true once the created ScaffoldRequest reports its
                    Completed condition True. Never reverts to False once True.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              repository:
                description: repository reflects the observed state of the owned GitHubRepository
                  XR.
                properties:
                  name:
                    description: name is the actual name of the created repository.
                    type: string
                  ready:
                    description: ready mirrors the owned GitHubRepository XR's Ready
                      condition.
                    type: boolean
                  url:
                    description: url is the HTML URL of the created repository, promoted
                      from the XR.
                    type: string
                required:
                - ready
                type: object
              scaffold:
                description: |-
                  scaffold reflects the observed state of the created ScaffoldRequest.
                  Only set once spec.scaffold is set and a ScaffoldRequest has been
                  created for this Component.
                properties:
                  commitSHA:
                    description: |-
                      commitSHA is the commit created in the component's own repository,
                      mirrored from ScaffoldRequest.status.commitSHA.
                    type: string
                  completed:
                    description: completed mirrors the ScaffoldRequest's Completed
                      condition.
                    type: boolean
                  template:
                    description: template is the scaffold template that was requested.
                    type: string
                  templateRevision:
                    description: |-
                      templateRevision is the immutable platform-scaffolds commit SHA the
                      template was actually rendered from, mirrored from
                      ScaffoldRequest.status.templateRevision.
                    type: string
                  version:
                    description: version is the scaffold template version that was
                      requested.
                    type: string
                required:
                - completed
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
