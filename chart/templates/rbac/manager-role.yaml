apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "component-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - platform.taskapp.io
  resources:
  - components
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.taskapp.io
  resources:
  - components/finalizers
  verbs:
  - update
- apiGroups:
  - platform.taskapp.io
  resources:
  - components/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - repo.taskapp.io
  resources:
  - githubrepositories
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - repo.taskapp.io
  resources:
  - githubrepositories/status
  verbs:
  - get
