name: CI

# Every check runs on every push and PR. On main, the image is pushed only
# after all of them pass, then deployed to management: bump-infra.yml in
# application-repositories pins infra/component-operator (chart and image) to
# the commit. Set the repo variable AUTO_DEPLOY=false to stop the deploy.
on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  test-e2e:
    uses: ./.github/workflows/test-e2e.yml
    permissions:
      contents: read

  test-chart:
    uses: ./.github/workflows/test-chart.yml
    permissions:
      contents: read

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, test-e2e, test-chart]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and Push Operator Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # No secrets here; bump-infra.yml gets its credentials through this job's
  # OIDC token (bootstrap-cluster/terraform/github-actions-oidc).
  deploy:
    name: Deploy to management
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY != 'false'
    permissions:
      contents: read
      id-token: write
    uses: entr0pian/application-repositories/.github/workflows/bump-infra.yml@main
    with:
      component: component-operator
      sha: ${{ github.sha }}
